name: Release to npm

# Publishes every package in this repo whose version is not yet on npm.
#
# Two packages now ship from here, and they are INDEPENDENT: `margins-cli` and
# `@alvistar/margins-stash-core`, each with its own version and its own reason to
# move. So the trigger watches both manifests and each publish step decides for
# itself, rather than one version file gating the other — the library changes far
# more often than the CLI's user-facing behaviour does, and the reverse is also
# true.
#
# The library publishes FIRST. Nothing in this repo needs that order (tsdown
# bundles the library into the CLI, so the CLI builds from the workspace copy),
# but the Margins Light runtime installs it from the registry, and a CLI release
# that announced a library version npm did not yet have would be a lie for
# however long the second step took.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - packages/*/package.json
  workflow_dispatch:

concurrency:
  group: npm-publish-margins-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm mints the credential from this token, so there is
      # no NPM_TOKEN in this repo and nothing to rotate or leak.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read versions
        id: version
        run: |
          CLI=$(node -e "process.stdout.write(require('./package.json').version)")
          CORE=$(node -e "process.stdout.write(require('./packages/stash-core/package.json').version)")
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "margins-cli $CLI | @alvistar/margins-stash-core $CORE"

      # Both checks ask for the EXACT version rather than comparing against
      # `latest`: a re-run, a revert, or a second push touching either manifest
      # must be a no-op, not a failed publish.
      - name: Check whether each version is already published
        id: check
        run: |
          if npm view "@alvistar/margins-stash-core@${{ steps.version.outputs.core }}" version >/dev/null 2>&1; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "stash-core ${{ steps.version.outputs.core }} already on npm, skipping"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "margins-cli@${{ steps.version.outputs.cli }}" version >/dev/null 2>&1; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
            echo "margins-cli ${{ steps.version.outputs.cli }} already on npm, skipping"
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.core == 'false' || steps.check.outputs.cli == 'false'
        run: npm ci

      # Builds both: the workspace library (tsc → dist) and then the CLI bundle,
      # which inlines it. `npm run build` at the root already chains the two.
      - name: Build
        if: steps.check.outputs.core == 'false' || steps.check.outputs.cli == 'false'
        run: npm run build

      - name: Publish @alvistar/margins-stash-core
        if: steps.check.outputs.core == 'false'
        run: npm publish -w @alvistar/margins-stash-core --access public --provenance

      - name: Publish margins-cli
        if: steps.check.outputs.cli == 'false'
        run: npm publish --access public --provenance
